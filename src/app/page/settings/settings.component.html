<br>
<span class="flex w-full text-orange-400 justify-content-center mb-2">CAVE! This page stores zero data - All settings, results and statistics are lost after reloading!</span>
<div class="card flex justify-content-center mx-4">
  <p-accordion class="w-full">
    <p-accordionTab header="Test Simulation Settings" [disabled]="true">
    </p-accordionTab>
    <p-accordionTab header="Single Tasks General Settings">
      <div class="card flex">
        <div class="flex-column mb-1">
          <ng-container *ngTemplateOutlet="checkbox;context:{ctx:_settings.normalTaskSettingShowTimeAfterAverage}">
          </ng-container>
          <ng-container *ngTemplateOutlet="checkbox;context:{ctx:_settings.normalTaskSettingShowSolutionPathFooter}">
          </ng-container>
        </div>
      </div>
    </p-accordionTab>
    <p-accordionTab header="KFF-Zahlenfolgen Tasks Settings">
      <div class="card flex">
        <div class="flex-column mb-1">
          <ng-container *ngTemplateOutlet="numberInput;context:{ctx:_settings.kffZfTaskSettingProbabilityAnswerEIsCorrect}">
          </ng-container>
        </div>
      </div>
    </p-accordionTab>
  </p-accordion>
</div>

<ng-template #checkbox let-ctx="ctx">
  <div class="field-checkbox">
    <p-checkbox
      [disabled]="ctx.preRelease"
      [(ngModel)]="ctx.model"
      [label]="ctx.label"
      [binary]="true"/>
    @if (ctx.description || ctx.preRelease) {
      <span class="pi pi-info-circle ml-2" [pTooltip]="ctx.preRelease? 'This setting is not in use yet' : ctx.description"></span>
    }
  </div>
</ng-template>
<ng-template #numberInput let-ctx="ctx">
  <div class="field-checkbox">
    <p-inputNumber [(ngModel)]="ctx.model" buttonLayout="horizontal"
                   [disabled]="ctx.preRelease"
                   [inputStyle]="{'width': '5rem'}"
                   class="mr-2"
                   mode="decimal"
                   [minFractionDigits]="0" [maxFractionDigits]="2"
                   [showButtons]="true"
                   [step]="ctx.numberSteps??1"
                   [min]="ctx.min??0" [max]="ctx.max??999999" [maxlength]="ctx.maxLength??6"
                   decrementButtonClass="p-button-secondary" incrementButtonClass="p-button-secondary"
                   incrementButtonIcon="pi pi-plus" decrementButtonIcon="pi pi-minus"/>
    - {{ctx.label}}
    @if (ctx.description) {
      <span class="pi pi-info-circle ml-2" [pTooltip]="ctx.preRelease? 'This setting is not in use yet' : ctx.description"></span>
    }
  </div>
</ng-template>
